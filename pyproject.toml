[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eventpilot-ai"
version = "1.0.0"
description = "EventPilot AI: Autonomous Multi-Agent College Event Coordination System built on Fetch.ai uAgents & ACP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uagents>=0.26.0",
    "uagents-core>=0.4.11",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "qrcode[pil]>=8.0",
    "pillow>=10.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
