services:
  mysql:
    image: mysql:8.0
    container_name: eventpilot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: eventpilot_db
      MYSQL_USER: eventpilot
      MYSQL_PASSWORD: eventpilot123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "eventpilot", "-peventpilot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  eventpilot-api:
    build: .
    container_name: eventpilot-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://eventpilot:eventpilot123@mysql:3306/eventpilot_db
      - APP_ENV=production
      - API_PORT=8080
      - COORDINATOR_PORT=8000
    ports:
      - "8080:8080"
      - "8000:8000"

volumes:
  mysql_data:
